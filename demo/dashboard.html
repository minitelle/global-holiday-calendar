<html lang="en">
<head>

<title>Global holiday calendar 2025 to 2028</title>

<style>
:root{--bg:#F4F5F7;--surface:#FFFFFF;--soft:#F8F9FB;--ink:#1A1D23;--text:#374151;--muted:#6B7280;--faint:#9CA3AF;--rule:#E2E5EA;--ph:#B91C1C;--mk:#0F766E;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171C;--surface:#1C2026;--soft:#181B21;--ink:#EEF0F3;--text:#D4D8DE;--muted:#A0A7B2;--faint:#6E7682;--rule:#2C313A;--ph:#F87171;--mk:#2DD4BF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171C;--surface:#1C2026;--soft:#181B21;--ink:#EEF0F3;--text:#D4D8DE;--muted:#A0A7B2;--faint:#6E7682;--rule:#2C313A;--ph:#F87171;--mk:#2DD4BF;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:13px;min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--rule);padding:12px 16px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:100}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:101;background:var(--surface)}
.header-top{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.wordmark{font-size:15px;font-weight:600;letter-spacing:-.3px}.wordmark span{color:var(--muted);font-weight:400}
.controls-wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;padding-bottom:12px}
.ctrl-section{display:flex;flex-direction:column;gap:5px}
.ctrl-label{font-size:11px;font-weight:600;color:var(--faint)}
.ctrl-grp{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:3px;flex-wrap:wrap}
.ctrl-btn{padding:5px 11px;border-radius:6px;border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;white-space:nowrap}
.ctrl-btn .btn-sub{font-size:9px;color:var(--faint);line-height:1}
.ctrl-btn:hover{background:var(--surface);color:var(--ink)}
.ctrl-btn.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
.ctrl-btn:focus-visible,select:focus-visible,.toggle:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
select{font-family:inherit;font-size:12px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:6px 8px}
.toggle{display:flex;align-items:center;gap:8px;font-family:inherit;font-size:12px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:6px 10px;cursor:pointer}
.toggle .sw{width:26px;height:15px;border-radius:99px;background:var(--rule);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-pressed="true"] .sw{background:var(--ink)}.toggle[aria-pressed="true"] .sw::after{transform:translateX(11px);background:var(--surface)}
#context-strip{background:var(--soft);border-bottom:1px solid var(--rule);padding:8px 16px;font-size:12px;color:var(--muted)}
#context-strip b{color:var(--text);font-weight:600}
#stats{display:flex;gap:1px;background:var(--rule);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.stat-cell{flex:1 1 120px;background:var(--surface);padding:10px 16px}
.stat-val{font-size:20px;font-weight:600;line-height:1}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:3px}
#cal-wrap{padding:16px;max-width:1100px;margin:0 auto}
#calendar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:680px){#calendar{grid-template-columns:1fr}}
@media(min-width:681px) and (max-width:900px){#calendar{grid-template-columns:repeat(2,1fr)}}
.month-card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.month-name{font-size:13px;font-weight:600;padding:10px 12px 8px;border-bottom:1px solid var(--bg)}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 8px 10px;gap:2px}
.day-head{text-align:center;font-size:10px;font-weight:500;color:var(--faint);padding:2px 0 4px}
.day-cell{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:11px;font-weight:500;color:var(--text);overflow:hidden}
.day-cell.has-ev{cursor:pointer}.day-cell.has-ev:hover{filter:brightness(.93)}
.day-cell:focus-visible{outline:2px solid var(--ink);outline-offset:1px;z-index:1}
.day-cell.we{color:var(--faint)}.day-cell.today{box-shadow:0 0 0 2px var(--ink)}
.ph-dot{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--ph);border:1.5px solid var(--surface)}
.mk-dot{position:absolute;top:2px;left:2px;width:5px;height:5px;transform:rotate(45deg);background:var(--mk);border:1px solid var(--surface)}
.tr-strip{position:absolute;bottom:0;left:0;right:0;height:4px;display:flex}.tr-strip b{flex:1}
#legend{background:var(--surface);padding:12px 16px;max-width:1100px;margin:0 auto 24px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;border:1px solid var(--rule);border-radius:10px}
.leg-grp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.leg-sep{width:1px;height:14px;background:var(--rule)}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.leg-swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.leg-line{width:18px;height:4px;border-radius:2px;flex-shrink:0}
.leg-ph{width:8px;height:8px;border-radius:50%;background:var(--ph)}
.leg-mk{width:7px;height:7px;transform:rotate(45deg);background:var(--mk);margin:0 2px}
#detail{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(12px);background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px 20px;max-width:380px;width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:all .2s;z-index:200;max-height:60vh;overflow:auto}
#detail.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
#det-close{position:absolute;top:10px;right:12px;background:none;border:none;font-size:18px;color:var(--faint);cursor:pointer;font-family:inherit}
.det-date{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:10px;padding-right:20px}
.det-row{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.det-swatch{width:12px;height:12px;border-radius:3px;margin-top:2px;flex-shrink:0}
.det-name{font-size:13px;font-weight:600;line-height:1.3}
.det-sub{font-size:11px;color:var(--muted);margin-top:1px}
.det-state{display:inline-block;margin-left:6px;font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--bg);color:var(--text)}
.det-fy{margin-top:10px;padding-top:8px;border-top:1px solid var(--rule);font-size:11px;color:var(--faint)}
</style>
</head>

function eachDay(fn){for(let m=1;m<=12;m++)for(let d=1;d<=new Date(year,m,0).getDate();d++)fn(key(year,m,d))}
function render(){renderContext();renderStats();renderCal();renderLegend();closeDetail()}
function renderContext(){document.getElementById('context-strip').innerHTML='<b>'+year+'</b> · '+CC_NAMES[cc]+(cc==='AU'?(st==='ALL'?' · all states and territories':' · '+st+' and national'):'')+' · click any marked day for details, including the AU fiscal week'}
function renderStats(){let ph=0,cd=0,mk=0,se=0,ob=0;
  eachDay(function(s){getEvts(s).forEach(function(e){if(e.ph)ph++;else if(isMk(e))mk++;else if(isSE(e))se++;else cd++});ob+=getObs(s).length});
  const cell=function(v,l,c){return '<div class="stat-cell"><div class="stat-val"'+(c?' style="color:'+c+'"':'')+'>'+v+'</div><div class="stat-lbl">'+l+'</div></div>'};
  document.getElementById('stats').innerHTML=cell(ph,'Public holidays, '+cc)+cell(cd,'Commercial dates')+cell(se,'Sports and elections')+cell(mk,'Marketing moments','var(--mk)')+(relig?cell(ob,'Religious and cultural'):'')}
function renderCal(){const DH=['M','T','W','T','F','S','S'];let html='';
  for(let m=1;m<=12;m++){const first=new Date(year,m-1,1).getDay(),off=first===0?6:first-1,dim=new Date(year,m,0).getDate();
    html+='<div class="month-card"><div class="month-name">'+new Date(year,m-1,1).toLocaleString('en',{month:'long'})+' '+year+'</div><div class="day-grid">';
    DH.forEach(function(h){html+='<div class="day-head" aria-hidden="true">'+h+'</div>'});
    for(let i=0;i<off;i++)html+='<div class="day-cell" aria-hidden="true"></div>';
    for(let d=1;d<=dim;d++){const s=key(year,m,d),ev=getEvts(s),ob=getObs(s),dow=new Date(year,m-1,d).getDay();
      const ph=ev.find(function(e){return e.ph}),bgEv=ev.find(function(e){return !e.ph&&!isMk(e)&&SEASONS[e.s]}),mkEv=ev.find(isMk);
      const has=ev.length||ob.length;let cls='day-cell'+(dow===0||dow===6?' we':'')+(s===todayS?' today':'')+(has?' has-ev':'');
      let inner=d+(ph?'<span class="ph-dot"></span>':'')+(mkEv?'<span class="mk-dot"></span>':'');
      if(ob.length){const trs=[...new Set(ob.map(function(o){return o.tr}))].slice(0,3);inner+='<span class="tr-strip">'+trs.map(function(t){return '<b style="background:'+TRAD[t][1]+'"></b>'}).join('')+'</span>'}
      const label=[...ev.map(function(e){return e.n}),...ob.map(function(o){return o.n})].join(', ');
      html+='<div class="'+cls+'"'+(bgEv?' style="background:'+SEASONS[bgEv.s].bg+';color:#1A1D23"':'')+(has?' tabindex="0" role="gridcell" aria-label="'+s+': '+label.replace(/"/g,'&quot;')+'" data-d="'+s+'"':' role="gridcell"')+'>'+inner+'</div>'}
    html+='</div></div>'}
  const cal=document.getElementById('calendar');cal.innerHTML=html;
  cal.querySelectorAll('[data-d]').forEach(function(c){c.onclick=function(){showDetail(c.dataset.d)};c.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();showDetail(c.dataset.d)}}})}
function renderLegend(){const used=new Set(),trs=new Set();let mk=false;
  eachDay(function(s){getEvts(s).forEach(function(e){if(isMk(e))mk=true;else if(!e.ph&&e.s)used.add(e.s)});getObs(s).forEach(function(o){trs.add(o.tr)})});
  let h='<div class="leg-grp"><div class="leg-item"><span class="leg-ph"></span>Public holiday</div>'+(mk?'<div class="leg-item"><span class="leg-mk"></span>Marketing moment (Printful)</div>':'');
  [...used].sort().forEach(function(s){const m=SEASONS[s];if(m)h+='<div class="leg-item"><span class="leg-swatch" style="background:'+m.bg+';border:1.5px solid '+m.color+'"></span>'+m.label+'</div>'});
  h+='</div>';
  if(trs.size){h+='<div class="leg-sep"></div><div class="leg-grp">';Object.keys(TRAD).forEach(function(t){if(trs.has(t))h+='<div class="leg-item"><span class="leg-line" style="background:'+TRAD[t][1]+'"></span>'+TRAD[t][0]+'</div>'});h+='</div>'}
  document.getElementById('legend').innerHTML=h}
function showDetail(s){const ev=getEvts(s),ob=getObs(s);if(!ev.length&&!ob.length)return;
  const lbl=new Date(s+'T00:00:00').toLocaleDateString('en',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let h='<div class="det-date">'+lbl+'</div>';
  ev.forEach(function(e){const m=SEASONS[e.s];const col=e.ph?'#B91C1C':(m?m.color:'#6B7280'),bg=e.ph?'#FEE2E2':(m?m.bg:'#F4F5F7');
    const meta=e.ph?'Public holiday, '+CC_NAMES[cc]+(e.sub?' ('+e.sub+' only)':''):(m?m.label:'Commercial date');
    h+='<div class="det-row"><span class="det-swatch" style="background:'+bg+';border:1.5px solid '+col+'"></span><div><div class="det-name">'+e.n+(e.sub?'<span class="det-state">'+e.sub+'</span>':'')+'</div><div class="det-sub">'+meta+(e.est?' · date estimated':'')+'</div></div></div>'});
  ob.forEach(function(o){const t=TRAD[o.tr];let note=t[0];
    if(o.tr==='jewish'||o.tr==='islamic'||o.tr==='bahai')note+=' · begins at sundown the evening before';
    if(o.est)note+=o.tr==='islamic'?' · may shift a day with moon sighting':' · date estimated';
    h+='<div class="det-row"><span class="det-swatch" style="background:'+t[1]+'"></span><div><div class="det-name">'+o.n+'</div><div class="det-sub">'+note+'</div></div></div>'});
  h+='<div class="det-fy">'+fyInfo(s)+'</div>';
  document.getElementById('det-body').innerHTML=h;const p=document.getElementById('detail');p.classList.add('show');p.removeAttribute('aria-hidden');document.getElementById('det-close').focus()}
function closeDetail(){const p=document.getElementById('detail');p.classList.remove('show');p.setAttribute('aria-hidden','true')}
document.getElementById('det-close').onclick=closeDetail;
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDetail()});
buildControls();render();
</script>
</body>
</html>
